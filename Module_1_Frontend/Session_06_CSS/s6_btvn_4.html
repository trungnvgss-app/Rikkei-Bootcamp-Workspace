<!doctype html>
<html lang="vi">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blog</title>
    <link rel="stylesheet" href="./s6_btvn_4.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa Blog cá nhân)
       1. Chức năng: Chứa toàn bộ giao diện của trang blog với sidebar và content.
       2. Lý do: Là container gốc cho các phần tử layout chính.
       3. Lưu ý: Mọi nội dung hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <header>: ヘッダー(へっだー) (Phần đầu trang blog)
         1. Chức năng: Hiển thị tên blog và các liên kết điều hướng cấp cao.
         2. Lý do: Giúp định danh trang web và điều hướng người dùng.
         3. Lưu ý: Sử dụng màu nền xanh đặc trưng. -->
    <header>
      <h1>My Blog</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Categories</a>
        <a href="#">About</a>
      </nav>
    </header>

    <!-- <div>: コンテナ要素(こんてなようそ) (Khung chứa Sidebar và Content)
         1. Chức năng: Chia trang web thành hai cột bằng Flexbox.
         2. Lý do: Tạo bố cục blog truyền thống với sidebar bên trái và nội dung bên phải.
         3. Lưu ý: Có class "container" để quản lý layout. -->
    <div class="container">
      <!-- <aside>: サイドバー(さいどばー) (Thanh bên chứa chuyên mục)
           1. Chức năng: Hiển thị danh sách các chuyên mục bài viết.
           2. Lý do: Giúp người dùng lọc và tìm kiếm bài viết theo chủ đề.
           3. Lưu ý: Sử dụng thẻ semantic aside cho nội dung bổ trợ. -->
      <aside class="sidebar">
        <h3>Chuyên mục</h3>
        <ul>
          <li><a href="#">CSS</a></li>
          <li><a href="#">JavaScript</a></li>
          <li><a href="#">HTML</a></li>
        </ul>
      </aside>

      <!-- <main>: メイン(めいん) (Vùng nội dung bài viết chính)
           1. Chức năng: Chứa các thẻ article đại diện cho từng bài blog.
           2. Lý do: Là khu vực tập trung thông tin quan trọng nhất của trang.
           3. Lưu ý: Sử dụng thẻ semantic main. -->
      <main class="content">
        <!-- <article>: 記事(きじ) (Thẻ bài viết blog)
             1. Chức năng: Bao bọc nội dung của một bài viết cụ thể.
             2. Lý do: Sử dụng thẻ semantic article cho nội dung độc lập, có thể tái sử dụng.
             3. Lưu ý: Chứa tiêu đề, hình ảnh và đoạn tóm tắt. -->
        <article class="post">
          <h2>Bài viết 1</h2>
          <div class="post-image yellow-bg">
            <img
              src="https://via.placeholder.com/200x100?text=JS+Logo"
              alt="JS"
            />
          </div>
          <p>Đây là nội dung tóm tắt của bài viết 1.</p>
        </article>

        <hr />

        <article class="post">
          <h2>Bài viết 2</h2>
          <div class="post-image dark-bg">
            <img
              src="https://via.placeholder.com/200x100?text=JS+Concept"
              alt="JS 2"
            />
          </div>
          <p>Đây là nội dung tóm tắt của bài viết 2.</p>
        </article>
      </main>
    </div>

    <!-- <footer>: フッター(ふったー) (Phần chân trang)
         1. Chức năng: Hiển thị thông tin liên hệ và bản quyền.
         2. Lý do: Cung cấp thông tin bổ sung và hoàn thiện cấu trúc trang.
         3. Lưu ý: Sử dụng thẻ semantic footer. -->
    <footer>
      <p>Liên hệ: email@example.com</p>
    </footer>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
