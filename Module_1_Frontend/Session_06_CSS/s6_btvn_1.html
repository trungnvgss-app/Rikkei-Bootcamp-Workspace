<!doctype html>
<html lang="vi">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giới thiệu bản thân - TSUBASA</title>
    <link rel="stylesheet" href="./s6_btvn_1.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa thông tin giới thiệu)
       1. Chức năng: Chứa toàn bộ nội dung hiển thị của trang Profile.
       2. Lý do: Là container gốc cho các phần tử header, main, footer.
       3. Lưu ý: Mọi thành phần nhìn thấy được đều nằm trong thẻ này. -->
  <body>
    <!-- <header>: ヘッダー(へっだー) (Phần đầu trang)
         1. Chức năng: Chứa tiêu đề trang và thanh điều hướng (nav).
         2. Lý do: Giúp người dùng nhận diện thương hiệu và điều hướng trang web.
         3. Lưu ý: Thường nằm ở vị trí trên cùng của tài liệu. -->
    <header>
      <h1>Giới Thiệu Bản Thân</h1>
      <!-- <nav>: ナビゲーション(ないびげーしょん) (Menu điều hướng)
           1. Chức năng: Chứa danh sách các liên kết chính của trang web.
           2. Lý do: Giúp người dùng di chuyển giữa các trang hoặc các phần nội dung.
           3. Lưu ý: Sử dụng thẻ semantic nav để trình duyệt và SEO hiểu rõ vai trò. -->
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <!-- <main>: メイン(めいん) (Vùng nội dung chính)
         1. Chức năng: Chứa thông tin profile và bio của người dùng.
         2. Lý do: Đại diện cho nội dung quan trọng nhất và duy nhất trên trang này.
         3. Lưu ý: Có class "container" để căn giữa nội dung. -->
    <main class="container">
      <div class="profile-section">
        <div class="avatar-container">
          <img src="./dataset/avatar/tsubasa.jpg" alt="Avatar" class="avatar" />
        </div>
        <div class="bio-text">
          <p>
            Xin chào! Tôi là <strong>TSUBASA</strong>, một lập trình viên đam mê
            học hỏi và sáng tạo.
          </p>
        </div>
      </div>
    </main>

    <!-- <footer>: フッター(ふったー) (Phần chân trang)
         1. Chức năng: Chứa thông tin bản quyền và các liên kết mạng xã hội.
         2. Lý do: Cung cấp thông tin bổ sung và cách thức liên lạc cuối trang.
         3. Lưu ý: Thường nằm ở cuối tài liệu. -->
    <footer>
      <p>
        &copy; 2024 [Tên bạn]. Kết nối với tôi trên
        <a href="#">Facebook</a> hoặc <a href="#">LinkedIn</a>.
      </p>
    </footer>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
