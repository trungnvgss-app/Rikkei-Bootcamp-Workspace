<!doctype html>
<html lang="vi">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website - Landing Page</title>
    <link rel="stylesheet" href="./s6_btvn_5.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa Landing Page)
       1. Chức năng: Chứa toàn bộ giao diện của trang Landing Page.
       2. Lý do: Là container gốc cho các phần Navbar, Hero và Features.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <header>: ヘッダー(へっだー) (Thanh điều hướng - Navbar)
         1. Chức năng: Chứa logo và các liên kết điều hướng chính.
         2. Lý do: Giúp người dùng dễ dàng chuyển hướng và nhận diện thương hiệu.
         3. Lưu ý: Có class "navbar" để định dạng vị trí cố định hoặc layout flex. -->
    <header class="navbar">
      <div class="container nav-wrapper">
        <div class="logo">MyLogo</div>
        <nav>
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Services</a>
          <a href="#">Contact</a>
        </nav>
      </div>
    </header>

    <!-- <section>: セクション(せくしょん) (Vùng Hero - Giới thiệu chính)
         1. Chức năng: Hiển thị thông điệp chào mừng và nút kêu gọi hành động (CTA).
         2. Lý do: Tạo sự chú ý ngay lập tức khi người dùng vừa vào trang.
         3. Lưu ý: Sử dụng class "hero" để định dạng chiều cao và nền. -->
    <section class="hero">
      <div class="container">
        <h1>Welcome to My Website</h1>
        <p>We provide the best solutions for your business.</p>
        <a href="#" class="btn-get-started">Get Started</a>
      </div>
    </section>

    <!-- <section>: セクション(せくしょん) (Phần tính năng - Features)
         1. Chức năng: Hiển thị các dịch vụ hoặc tính năng nổi bật của doanh nghiệp.
         2. Lý do: Cung cấp thông tin chi tiết về giá trị mà trang web mang lại.
         3. Lưu ý: Sử dụng "feature-grid" để sắp xếp các khối tính năng. -->
    <section class="features">
      <div class="container feature-grid">
        <div class="feature-box">Feature 1</div>
        <div class="feature-box">Feature 2</div>
        <div class="feature-box">Feature 3</div>
      </div>
    </section>

    <!-- <footer>: フッター(ふったー) (Phần chân trang)
         1. Chức năng: Chứa thông tin liên hệ của trang web.
         2. Lý do: Hoàn thiện cấu trúc trang và cung cấp kênh giao tiếp.
         3. Lưu ý: Sử dụng thẻ semantic footer. -->
    <footer>
      <div class="container">
        <p>Contact us: email@example.com</p>
      </div>
    </footer>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
