<!doctype html>
<html lang="vi">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S5 BTVN6 Cards</title>
    <link rel="stylesheet" href="s5_btvn6.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa các thẻ tin tức và media)
       1. Chức năng: Chứa toàn bộ nội dung hiển thị của các thẻ card phức tạp.
       2. Lý do: Là container gốc cho toàn bộ giao diện bài tập vị trí và animation.
       3. Lưu ý: Sử dụng font-family "Inter" để có giao diện hiện đại. -->
  <body>
    <!-- <main>: メイン(めいん) (Vùng hiển thị lưới các thẻ card)
         1. Chức năng: Tổ chức các bài viết (article) theo dạng lưới (grid).
         2. Lý do: Giúp giao diện hiển thị linh hoạt trên nhiều thiết bị.
         3. Lưu ý: Class "card-grid" dùng CSS Grid để phân bổ cột. -->
    <main class="card-grid">
      <!-- <article>: 記事(きじ) (Thẻ tin tức nổi bật - Hero Card)
           1. Chức năng: Hiển thị bài viết chính với hình ảnh nền lớn và tiêu đề.
           2. Lý do: Sử dụng thẻ semantic article để đại diện cho nội dung độc lập.
           3. Lưu ý: Sử dụng CSS variables (--bg-image) để truyền hình ảnh nền. -->
      <article
        class="hero-card news-card"
        style="
          --bg-image: url(&quot;https://sohanews.sohacdn.com/160588918557773824/2025/2/28/48124643610580965096955221408109563142184531n-1740715696438294836564-1740736758795-17407367590552119761885.jpg&quot;);
        "
      >
        <div class="card-overlay"></div>
        <div class="news-top">
          <span class="view-badge">👁</span>
          <span class="view-text">79.174 lượt xem</span>
        </div>
        <h1 class="hero-title">
          Sao Việt 14/8: Hoài Lâm xuất hiện tỉnh táo, cười rạng rỡ bên bạn gái
        </h1>
      </article>

      <article
        class="hero-card media-card"
        style="--bg-image: url(dataset/position_properties/auto.jpg)"
      >
        <div class="card-overlay"></div>
        <div class="media-label">AUTOMOTIVE</div>
        <img
          class="card-logo"
          src="../../About_Dataset/logo/rikkei_logo.png"
          alt="Rikkei logo"
        />
        <div class="media-actions">
          <span class="icon-button gear">⚙</span>
          <span class="action-line top"></span>
          <span class="icon-tag">A</span>
          <span class="action-line bottom"></span>
          <span class="icon-tag">B</span>
        </div>
        <div class="media-copy">
          <h2>Car Repairing Tracking</h2>
          <p>All Platform</p>
        </div>
      </article>

      <article
        class="hero-card promo-card"
        style="--bg-image: url(dataset/position_properties/03.png)"
      >
        <div class="card-overlay"></div>
        <div class="promo-copy">
          <h2>Latest Thinking</h2>
          <p>Equip yourself with RikkeiSoft latest knowledge.</p>
          <a class="promo-link" href="#">Explore</a>
        </div>
      </article>
    </main>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
