<!doctype html>
<html lang="vi">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Item Hover Effect</title>
    <link rel="stylesheet" href="s5_btvn2.css" />
  </head>
  <body>
    <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa toàn bộ nội dung)
         1. Chức năng: Chứa toàn bộ phần tử hiển thị trên trang.
         2. Lý do: Phần tử gốc để áp dụng CSS cho toàn bộ trang.
         3. Lưu ý: Là container chính của tài liệu. -->
    <!-- <h2>: ヘッダー2(へっだーつー) (Tiêu đề cấp 2)
         1. Chức năng: Hiển thị tiêu đề phần danh sách.
         2. Lý do: Giúp cấu trúc ngữ nghĩa và SEO.
         3. Lưu ý: Dùng để mô tả nội dung danh sách phía dưới. -->
    <h2>Item List</h2>
    <!-- <ul>: リスト(りすと) (Danh sách không thứ tự)
         1. Chức năng: Chứa các mục item trước khi hover.
         2. Lý do: Thẻ semantic cho danh sách, giúp dễ styling với CSS.
         3. Lưu ý: class="item-list" để áp dụng style CSS cụ thể. -->
    <ul class="item-list">
      <!-- <li>: リスト項目(りすとこうもく) (Mục trong danh sách)
           1. Chức năng: Hiển thị từng item (Item 1, 2, 3, 4).
           2. Lý do: Để thể hiện các phần tử danh sách, dễ áp dụng hover effect.
           3. Lưu ý: class="item" để trigger :hover background change. -->
      <li class="item">Item 1</li>
      <li class="item">Item 2</li>
      <li class="item">Item 3</li>
      <li class="item">Item 4</li>
    </ul>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
