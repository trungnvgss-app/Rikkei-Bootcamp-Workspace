  <!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
<head>

  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa toàn bộ nội dung)
       1. Chức năng: Container gốc chứa tất cả phần tử HTML hiển thị.
       2. Lý do: Là phần tử gốc để áp dụng CSS toàn trang và flexbox centering.
       3. Lưu ý: Là nơi áp dụng display: flex để center nút Submit. -->
  <body>
    <!-- <button>: ボタン(ぼたん) (Nút bấm gửi dữ liệu)
         1. Chức năng: Nút Submit để gửi dữ liệu form.
         2. Lý do: Dùng để tương tác với người dùng, có style border đặc biệt từng cạnh.
         3. Lưu ý: Nằm giữa trang nhờ flexbox của body. -->
    <button>Submit</button>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
