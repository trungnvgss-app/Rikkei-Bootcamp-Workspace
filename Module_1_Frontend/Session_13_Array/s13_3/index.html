<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đảo Ngược Mảng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.6;
        }
        .container {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            max-width: 500px;
        }
        input[type="text"] {
            padding: 10px;
            width: 70%;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
            color: #d9534f;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Đảo Ngược Các Phần Tử Trong Mảng</h2>
        <p>Nhập vào một dãy số bất kỳ, cách nhau bởi dấu phẩy (,):</p>
        
        <input type="text" id="chuoiNhap" placeholder="Ví dụ: 1, 2, 3, 4, 5">
        
        <button onclick="daoNguoc()">Đảo Ngược</button>

        <div class="result" id="ketQua"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
