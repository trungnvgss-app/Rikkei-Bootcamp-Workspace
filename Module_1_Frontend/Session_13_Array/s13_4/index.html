<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Số Lớn Nhất</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.6;
        }
        .container {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f4f4f9;
            max-width: 500px;
        }
        input {
            padding: 10px;
            width: 65%;
            margin-right: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tìm Phần Tử Lớn Nhất</h2>
        <p>Nhập vào dãy số của bạn (cách nhau bởi dấu phẩy):</p>
        
        <input type="text" id="chuoiSo" placeholder="Ví dụ: 3, 15, 7, 42, 9">
        <button onclick="timSoLonNhat()">Tìm Ngay</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
