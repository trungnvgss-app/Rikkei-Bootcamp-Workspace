<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thao Tác Với Mảng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #138496;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border: 2px dashed #ccc;
            background-color: #f8f9fa;
            display: inline-block;
        }
        #result {
            font-weight: bold;
            color: #d9534f;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <h2>Luyện tập tạo và thao tác với mảng</h2>
    <p>Nhấn vào nút bên dưới để tạo một mảng gồm 10 số ngẫu nhiên.</p>

    <button onclick="taoVaHienThiMang()">Tạo Mảng Ngẫu Nhiên</button>

    <br>
    <div class="result-box">
        <strong>Kết quả mảng:</strong>
        <div id="result">Chưa có dữ liệu...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
