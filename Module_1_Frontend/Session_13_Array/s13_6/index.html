<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Số Lần Xuất Hiện</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.6;
        }
        .container {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            max-width: 600px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #5a6268;
        }
        .box {
            margin-top: 15px;
            padding: 10px;
            background-color: #fff;
            border-left: 4px solid #007bff;
        }
        #mangHienThi {
            font-weight: bold;
            color: #333;
            letter-spacing: 2px;
        }
        #ketQua {
            color: #d9534f;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Đếm số lần xuất hiện của phần tử (k)</h2>
        <p>Nhấn nút bên dưới để tạo mảng ngẫu nhiên và nhập số cần tìm.</p>
        
        <button onclick="thucHienDem()">Bắt Đầu</button>
        
        <div class="box">
            <p><strong>Mảng dữ liệu:</strong></p>
            <div id="mangHienThi">Chưa khởi tạo...</div>
        </div>

        <div class="box">
            <p><strong>Kết quả kiểm tra:</strong></p>
            <div id="ketQua">Chưa có kết quả...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
