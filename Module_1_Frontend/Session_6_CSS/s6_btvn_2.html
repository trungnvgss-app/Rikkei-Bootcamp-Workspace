<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="./s6_btvn_2.css" />
  </head>
  <body>
    <div class="register-container">
      <form class="register-form">
        <h2>Đăng Ký</h2>

        <div class="form-group">
          <label for="fullname">Tên:</label>
          <input type="text" id="fullname" name="fullname" />
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu:</label>
          <input type="password" id="password" name="password" />
        </div>

        <button type="submit" class="btn-submit">Đăng Ký</button>
      </form>
    </div>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
