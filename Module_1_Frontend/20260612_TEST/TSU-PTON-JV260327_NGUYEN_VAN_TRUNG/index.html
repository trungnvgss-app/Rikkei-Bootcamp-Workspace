<!-- 
Bài Nội Dung Thực Hành: Hệ Thống Quản Lý Công Việc (Task Management)
Sinh viên viết chương trình quản lý danh sách công việc với các chức năng và thang điểm chi tiết như sau:
1. Khởi tạo dữ liệu [10 điểm]
Dữ liệu các công việc được quản lý bằng một mảng có tên là tasks. Mỗi đối tượng task phải chứa các trường thông tin: Mã công việc (Tự động tăng), Tên công việc, Người thực hiện, Deadline, Trạng thái (Chờ làm / Đang làm / Hoàn thành).
2. Thêm mới công việc [15 điểm]
Khi người dùng nhập đầy đủ thông tin vào form "Thêm công việc mới" và nhấn nút "Lưu công việc":
Tiến hành thêm đối tượng công việc mới vào mảng tasks.
Cập nhật và hiển thị lại danh sách mới nhất lên bảng "Danh sách công việc".
3. Xóa công việc [10 điểm]
Tại mỗi dòng của bảng danh sách, khi nhấn vào nút "Xóa" (Delete):
Chương trình sẽ hiển thị một hộp thoại xác nhận (Confirm).
Nếu đồng ý, tiến hành xóa công việc đó khỏi mảng tasks và cập nhật lại giao diện.
4. Cập nhật công việc [15 điểm]
Khi nhấn vào nút "Sửa" (Edit) ở một dòng công việc:
Đẩy toàn bộ dữ liệu của công việc đó ngược trở lại các ô nhập liệu của Form.
Nút "Lưu công việc" chuyển thành "Cập nhật". Khi nhấn "Cập nhật", tiến hành lưu các thay đổi vào mảng tasks và hiển thị lại dữ liệu mới trên bảng.
5. Sắp xếp danh sách [15 điểm]
Thiết kế một nút hoặc bộ chọn (Select) cho phép sắp xếp danh sách công việc:
Sắp xếp theo Tên công việc (A-Z).
Hiển thị danh sách sau khi sắp xếp lên bảng.
6. Tìm kiếm công việc [15 điểm]
Tạo một ô Input tìm kiếm. Khi người dùng nhập ký tự (tìm theo Tên công việc hoặc Người thực hiện):
Bộ lọc sẽ tự động chạy (hoặc kích hoạt khi nhấn nút Tìm kiếm) để lọc ra các công việc thỏa mãn và hiển thị lên bảng.
7. Validate dữ liệu đầu vào [20 điểm]
Thực hiện kiểm tra tính hợp lệ của dữ liệu trước khi thêm mới hoặc cập nhật. Nếu không hợp lệ, hiển thị thông báo lỗi (Error message) ngay dưới ô input đó:
Tên công việc: Không được để trống, tối thiểu 5 ký tự.
Người thực hiện: Không được để trống.
Deadline (Ngày hoàn thành): Phải là một ngày ở tương lai (không được chọn ngày trong quá khứ hoặc ngày hiện tại).
Trạng thái: Mặc định ban đầu là "Chờ làm".
⚠️ YÊU CẦU BẮT BUỘC: TOÀN BỘ DỮ LIỆU PHẢI ĐƯỢC LƯU TRỮ VÀ ĐỌC RA TỪ LOCALSTORAGE. KHÔNG BỊ MẤT DỮ LIỆU KHI NHẤN REFRESH (F5) TRÌNH DUYỆT.
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống quản lý công việc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hệ thống quản lý công việc</h1>
        <form id="taskForm" class="task-form">
            <input type="hidden" id="taskId"> <div class="form-group">
                <label for="taskName">Tên công việc:</label>
                <input type="text" id="taskName" placeholder="Nhập tên công việc">
                <span class="error-message" id="errorName"></span>
            </div>
            <div class="form-group">
                <label for="user">Người thực hiện:</label>
                <input type="text" id="user" placeholder="Nhập người thực hiện">
                <span class="error-message" id="errorUser"></span>
            </div>
            <div class="form-group">
                <label for="deadline">Deadline:</label>
                <input type="date" id="deadline">
                <span class="error-message" id="errorDeadline"></span>
            </div>
            <div class="form-group">
                <label for="status">Trạng thái:</label>
                <select id="status">
                    <option value="Chờ làm">Chờ làm</option>
                    <option value="Đang làm">Đang làm</option>
                    <option value="Hoàn thành">Hoàn thành</option>
                </select>
            </div>

            <button type="submit">Lưu công việc</button>
        </form>
    

        <hr> 

        <div class="task-list">
            <h2>Danh sách công việc</h2>
            <input type="text" id="searchInput" placeholder="Tìm kiếm công việc...">
            <select id="sortSelect">
                <option value="">Sắp xếp theo</option>
                <option value="name">Tên công việc (A-Z)</option>
            </select>
            <table id="taskTable">
                <thead>
                    <tr>
                        <th>Mã công việc</th>
                        <th>Tên công việc</th>
                        <th>Người thực hiện</th>
                        <th>Deadline</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>


    </div>
    <script src="script.js"></script>
    <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <a class="back-dashboard" href="../../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
