<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trích dẫn nổi bật</title>
    <link rel="stylesheet" href="s4_btvn_6.css" />
  </head>
  <body>
    <main>
      <!-- <main>: メイン(めいん) (Nội dung chính của trang)
           1. Chức năng: Bao bọc vùng nội dung quan trọng nhất của trang.
           2. Lý do: Giúp trình duyệt nhận diện khu vực hiển thị thẻ trích dẫn chính.
           3. Lưu ý: Chỉ sử dụng một thẻ main trong mỗi trang. -->
      <section class="quote-card">
        <!-- <section>: セクション(せくしょん) (Khung hiển thị trích dẫn nổi bật)
             1. Chức năng: Tạo khối bao quanh thẻ trích dẫn.
             2. Lý do: Giúp dễ dàng css class quote-card thành một vùng hộp riêng biệt.
             3. Lưu ý: Thường đi kèm với tiêu đề như h1-h6. -->
        <h1>Trích dẫn nổi bật</h1>
        <!-- <h1>: ヘッダー1(へっだーわん) (Tiêu đề lớn của phần)
             1. Chức năng: Hiển thị dòng tiêu đề lớn nhất của khu vực trích dẫn.
             2. Lý do: Cung cấp tiêu đề mô tả ngắn gọn cho trích dẫn bên dưới.
             3. Lưu ý: SEO tốt nhất khi mỗi khối nội dung rõ ràng có heading tương ứng. -->
        <blockquote>
          <!-- <blockquote>: 引用(いんよう) (Đoạn trích dẫn chính)
               1. Chức năng: Định dạng đoạn văn bản như một lời trích dẫn dài.
               2. Lý do: Ngữ nghĩa đúng chuẩn HTML cho nội dung trích từ nguồn khác.
               3. Lưu ý: Trình duyệt thường thụt lề mặc định cho thẻ này. -->
          “Kiến thức là sức mạnh.”
        </blockquote>
        <a class="btn-readmore" href="#">
          <!-- <a>: アンカー(あんかー) (Nút liên kết tới nội dung đọc thêm)
               1. Chức năng: Tạo liên kết điều hướng khi click.
               2. Lý do: Cho phép người dùng xem thêm chi tiết nếu quan tâm.
               3. Lưu ý: Đã được định dạng CSS thành dạng nút bấm trực quan. -->
          Đọc thêm
        </a>
      </section>
    </main>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
