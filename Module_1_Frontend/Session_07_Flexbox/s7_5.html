<!doctype html>
<html lang="en">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Layout - Separated</title>
    <link rel="stylesheet" href="./s7_5.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa nội dung Grid nâng cao)
       1. Chức năng: Chứa các khối hình học để thực hành chia lưới phức tạp.
       2. Lý do: Là container gốc cho bài tập thực hành Grid span.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <div>: コンテナ要素(こんてなようそ) (Khung chứa Grid Container)
         1. Chức năng: Tạo môi trường lưới với các khối có kích thước khác nhau.
         2. Lý do: Minh họa cách sử dụng grid-column và grid-row để gộp ô.
         3. Lưu ý: Có class "grid-container" để định dạng trong CSS. -->
    <div class="grid-container">
      <div class="box box-big">Big</div>
      <div class="box">Small 1</div>
      <div class="box">Small 2</div>
      <div class="box">Small 3</div>
      <div class="box">Small 4</div>

      <div class="box box-big">Big</div>
      <div class="box">Small 5</div>
      <div class="box">Small 6</div>
      <div class="box">Small 7</div>
      <div class="box">Small 8</div>
    </div>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
