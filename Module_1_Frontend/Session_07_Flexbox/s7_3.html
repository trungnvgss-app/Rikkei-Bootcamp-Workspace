<!doctype html>
<html lang="en">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Layout</title>
    <link rel="stylesheet" href="s7_3.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa nội dung Grid Layout)
       1. Chức năng: Chứa các khối hình vuông để thực hành bố cục lưới.
       2. Lý do: Là container gốc cho bài tập CSS Grid.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <div>: コンテナ要素(こんてなようそ) (Khung chứa Grid)
         1. Chức năng: Thiết lập layout Grid để sắp xếp các box con.
         2. Lý do: Minh họa cách chia cột và hàng trong CSS Grid.
         3. Lưu ý: Có class "container" với thuộc tính display: grid. -->
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box large">7</div>
    </div>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
