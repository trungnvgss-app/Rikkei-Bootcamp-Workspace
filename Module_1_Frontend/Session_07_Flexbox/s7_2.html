<!doctype html>
<html lang="en">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S7 BTVN3</title>
    <link rel="stylesheet" href="./s7_2.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa danh sách Flexbox)
       1. Chức năng: Chứa toàn bộ các khối item để thực hành thuộc tính flex-wrap.
       2. Lý do: Là container gốc cho bài tập layout linh hoạt.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <div>: コンテナ要素(こんてなようそ) (Khung chứa nhiều phần tử Flex)
         1. Chức năng: Sắp xếp các item con và cho phép chúng xuống dòng khi hết chỗ.
         2. Lý do: Minh họa cách xử lý layout khi có quá nhiều phần tử con.
         3. Lưu ý: Có class "flex-container" với thuộc tính flex-wrap: wrap. -->
    <div class="flex-container">
      <div class="flex-item">Item 1</div>
      <div class="flex-item">Item 2</div>
      <div class="flex-item">Item 3</div>
      <div class="flex-item">Item 4</div>
      <div class="flex-item">Item 5</div>
      <div class="flex-item">Item 6</div>
      <div class="flex-item">Item 7</div>
      <div class="flex-item">Item 8</div>
      <div class="flex-item">Item 9</div>
      <div class="flex-item">Item 10</div>
      <div class="flex-item">Item 11</div>
      <div class="flex-item">Item 12</div>
    </div>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
