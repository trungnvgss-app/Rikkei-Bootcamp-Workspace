<!doctype html>
<html lang="en">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./s7_1.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa nội dung Flexbox)
       1. Chức năng: Chứa toàn bộ nội dung hiển thị của bài tập Flexbox cơ bản.
       2. Lý do: Là container gốc cho các khối flex-item.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <div>: コンテナ要素(こんてなようそ) (Khung chứa Flexbox)
         1. Chức năng: Tạo môi trường Flex để căn chỉnh các phần tử con.
         2. Lý do: Minh họa thuộc tính display: flex để căn giữa.
         3. Lưu ý: Có class "flex-container" để định dạng trong CSS. -->
    <div class="flex-container">
      <div class="flex-item">Centered</div>
    </div>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
