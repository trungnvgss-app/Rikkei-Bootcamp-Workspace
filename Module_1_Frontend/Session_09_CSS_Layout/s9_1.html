<!doctype html>
<html lang="en">
  <!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripGuide</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./s9_1.css" />
  </head>

  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa nội dung TripGuide)
       1. Chức năng: Chứa toàn bộ giao diện của trang web du lịch.
       2. Lý do: Là container gốc cho Header, Main và Footer.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <header>: ヘッダー(へっだー) (Phần đầu trang TripGuide)
         1. Chức năng: Chứa Logo, đơn vị tiền tệ và thông tin người dùng.
         2. Lý do: Giúp người dùng nhận diện thương hiệu và thực hiện các thiết lập nhanh.
         3. Lưu ý: Có class "header_container" sử dụng Flexbox để căn chỉnh. -->
    <header>
      <div class="container header_container">
        <img src="./assets/imgs/logo.png" />
        <div class="left_block">
          <span>USD</span>

          <img src="./assets/imgs/usa_flag.png" alt="" />

          <div class="notice">
            <i class="fa-regular fa-bell"></i>
            <p>1</p>
          </div>

          <div class="user_box">
            <img
              class="avatar"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgVfHORQFLyUf_rNove-xUmxIskDeMJ63REz_YIMQ6S0vCyQdkBvJos4igKspvCgpqnpy8h0xM--1uckzZIxDgyoHy37-MowkF-YzvVx8&s=10"
            />
          </div>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
    <div
      style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc"
    >
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a
        class="back-dashboard"
        href="../index.html"
        style="
          display: inline-block;
          padding: 10px 16px;
          background: #d32f2f;
          color: #fff;
          border-radius: 6px;
          text-decoration: none;
          font-weight: 600;
        "
        >← Quay lại Dashboard</a
      >
    </div>
  </body>
</html>
