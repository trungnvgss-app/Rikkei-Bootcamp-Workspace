<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Mảng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            border-bottom: 2px solid #17a2b8;
            padding-bottom: 10px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px;
            cursor: pointer;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1em;
            transition: 0.3s;
        }
        button:hover {
            background-color: #138496;
        }
        .result-box {
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #17a2b8;
            font-size: 1.1em;
            white-space: pre-wrap;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>[Bài Tập] Luyện Tập Mảng</h2>
        <p>Nhấn vào từng nút để chạy bài tập tương ứng. Dữ liệu mảng yêu cầu nhập các số cách nhau bởi dấu phẩy (,).</p>
        
        <div class="btn-grid">
            <button onclick="bai1()">Bài 1: Đếm số >= 10</button>
            <button onclick="bai2()">Bài 2: Tìm giá trị lớn nhất & Vị trí</button>
            <button onclick="bai3()">Bài 3: Max & Giá trị trung bình</button>
            <button onclick="bai4()">Bài 4: Đảo ngược mảng</button>
            <button onclick="bai5()">Bài 5: Đếm số nguyên âm</button>
            <button onclick="bai6()">Bài 6: Kiểm tra số V có trong mảng</button>
            <button onclick="bai7()">Bài 7: Sắp xếp giảm dần</button>
            <button onclick="bai8()">Bài 8: Nối mảng (b + a = c)</button>
        </div>

        <h3>Kết quả hiển thị:</h3>
        <div class="result-box" id="ketQua">Bấm một nút để xem kết quả...</div>
    </div>

    <script src="script.js"></script>
    <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <a class="back-dashboard" href="../../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
