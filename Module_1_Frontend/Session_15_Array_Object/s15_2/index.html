<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Mảng Ký Tự & Chuỗi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            border-bottom: 2px solid #6f42c1;
            padding-bottom: 10px;
            color: #6f42c1;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
            margin-top: 20px;
        }
        button {
            padding: 12px;
            cursor: pointer;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1em;
            text-align: left;
            transition: 0.2s;
        }
        button:hover {
            background-color: #59359a;
        }
        .result-box {
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #6f42c1;
            font-size: 1.1em;
            white-space: pre-wrap; /* Giữ nguyên các dấu xuống dòng \n */
            border-radius: 4px;
            min-height: 50px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>[Bài Tập] Thao tác với mảng ký tự và chuỗi</h2>
        <p>Bấm vào các nút dưới đây để chạy từng bài tập:</p>
        
        <div class="btn-grid">
