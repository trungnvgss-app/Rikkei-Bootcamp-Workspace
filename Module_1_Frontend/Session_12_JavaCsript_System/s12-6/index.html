<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tổng Hợp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f2f5;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #6f42c1;

            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #59359a;
        }
        p {
            font-size: 1.1em;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>Bài Tập Tổng Hợp: Menu Chức Năng</h2>
    <p>Nhấn nút bên dưới để mở Menu tương tác.</p>
    
    <button onclick="chayChuongTrinh()">Khởi động Menu</button>
