<!DOCTYPE html> <!-- Khai báo HTML5 -->
<html lang="en"> <!-- Ngôn ngữ trang (tiếng Anh) -->
<head>
    <meta charset="UTF-8"> <!-- UTF-8 hỗ trợ đa ngôn ngữ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- responsive -->
    <title>ĐĂNG NHẬP</title> <!-- Tiêu đề tab trình duyệt -->
</head>
  <!-- <body>: 本文(ほんぶん) (Phần thân tài liệu)
       1. Chức năng: Chứa toàn bộ nội dung hiển thị trên trang web.
       2. Lý do: Đây là vùng không gian chính để trình duyệt render các phần tử UI.
       3. Lưu ý: Mọi phần tử nhìn thấy được đều phải nằm trong thẻ này. -->
<body> <!-- Nội dung hiển thị người dùng -->
    <!-- <h1>: 見出し要素(みだしようそ) (Thẻ tiêu đề cấp 1)
         1. Chức năng: Hiển thị tiêu đề chính lớn nhất của trang web.
         2. Lý do: Dùng làm tên màn hình (Đăng Nhập).
         3. Lưu ý: Mỗi trang chỉ nên có duy nhất một thẻ h1. -->
    <h1>ĐĂNG NHẬP</h1> <!-- Tiêu đề chính -->
    
    <!-- <form>: フォーム要素(ふぉーむようそ) (Biểu mẫu)
         1. Chức năng: Tạo một khu vực chứa các trường nhập liệu tương tác.
         2. Lý do: Thu thập thông tin tài khoản (username, password) từ người dùng.
         3. Lưu ý: Cần chỉ định thuộc tính action và method để gửi dữ liệu. -->
    <form action="login.php" method="post"> <!-- Gửi dữ liệu lên server qua login.php -->
        <label for="username">Username:</label> <!-- Gắn nhãn input -->
        <input type="text" id="username" name="username" required> <!-- ô nhập username -->
        <br> <!-- ngắt dòng -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required> <!-- ô nhập password ẩn ký tự -->
        <br>
        <input type="submit" value="Login"> <!-- nút gửi form -->
    </form>
    
    <!-- <div>: コンテナ要素(こんてなようそ) (Thẻ chứa/khối)
         1. Chức năng: Tạo một vùng chứa (wrapper) để gộp nhóm nút bấm.
         2. Lý do: Giúp dễ dàng định dạng CSS cho khu vực nút back.
         3. Lưu ý: Có thể cân nhắc dùng thẻ <nav> hoặc <section> nếu phù hợp ngữ nghĩa hơn. -->
    <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <a class="back-dashboard" href="../../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
