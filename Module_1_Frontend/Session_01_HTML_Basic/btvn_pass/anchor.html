<!DOCTYPE html> <!-- Khai báo HTML5 -->
<html lang="en"> <!-- Ngôn ngữ trang -->
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
<head>
    <meta charset="UTF-8"> <!-- Thiết lập mã hóa ký tự -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Thân thiện responsive -->
    <title>Anchor link</title> <!-- Tiêu đề tab -->
</head>
  <!-- <body>: 本文(ほんぶん) (Phần thân tài liệu)
       1. Chức năng: Chứa toàn bộ nội dung hiển thị trên trang web.
       2. Lý do: Đây là vùng không gian chính để trình duyệt render các phần tử UI.
       3. Lưu ý: Mọi phần tử nhìn thấy được đều phải nằm trong thẻ này. -->
<body> <!-- Phần nội dung hiển thị -->
    <!-- <h1>: 見出し要素(みだしようそ) (Thẻ tiêu đề cấp 1)
         1. Chức năng: Hiển thị tiêu đề chính lớn nhất của trang web.
         2. Lý do: Giới thiệu chủ đề của trang là dữ liệu anchor.
         3. Lưu ý: Mỗi trang chỉ nên có duy nhất một thẻ h1. -->
    <h1>Anchor data</h1> <!-- Tiêu đề chính -->
    <!-- Nguyên mẫu: thẻ <a> tạo liên kết, có thể tới URL hoặc anchor cùng trang -->
    
    <!-- <a>: アンカー要素(あんかーようそ) (Thẻ liên kết)
         1. Chức năng: Tạo một siêu liên kết đến một trang web khác hoặc một vị trí trong cùng trang.
         2. Lý do: Cho phép người dùng điều hướng giữa các tài nguyên hoặc vị trí.
         3. Lưu ý: Thuộc tính href là bắt buộc để chỉ định đích đến. -->
    <p><a href="https://www.example.com">Visit Example</a></p> <!-- href là thuộc tính quan trọng -->
    <p><a href="#bottom">Đến chân trang</a></p> <!-- anchor nội bộ với ID -->
    <div id="bottom">Bottom of page</div> <!-- ID mục tiêu cho anchor nội bộ -->
    
    <!-- <div>: コンテナ要素(こんてなようそ) (Thẻ chứa/khối)
         1. Chức năng: Tạo một vùng chứa (wrapper) để gộp nhóm nút bấm.
         2. Lý do: Giúp dễ dàng định dạng CSS cho khu vực nút back.
         3. Lưu ý: Có thể cân nhắc dùng thẻ <nav> hoặc <section> nếu phù hợp ngữ nghĩa hơn. -->
    <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
