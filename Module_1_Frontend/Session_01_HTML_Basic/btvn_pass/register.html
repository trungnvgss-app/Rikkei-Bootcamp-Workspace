<!DOCTYPE html> <!-- Khai báo tài liệu HTML5 -->
<html lang="en"> <!-- Ngôn ngữ trang giúp SEO và trợ năng -->
<head>
    <meta charset="UTF-8"> <!-- Mã hóa ký tự (hỗ trợ tiếng Việt) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive cho di động -->
    <title>ĐĂNG KÝ</title> <!-- Tiêu đề xuất hiện tab trình duyệt -->
</head>
  <!-- <body>: 本文(ほんぶん) (Phần thân tài liệu)
       1. Chức năng: Chứa toàn bộ nội dung hiển thị trên trang web.
       2. Lý do: Đây là vùng không gian chính để trình duyệt render các phần tử UI.
       3. Lưu ý: Mọi phần tử nhìn thấy được đều phải nằm trong thẻ này. -->
<body> <!-- Nội dung chính trang -->
    <!-- <h1>: 見出し要素(みだしようそ) (Thẻ tiêu đề cấp 1)
         1. Chức năng: Hiển thị tiêu đề chính lớn nhất của trang web.
         2. Lý do: Dùng làm tên màn hình (Đăng Ký).
         3. Lưu ý: Mỗi trang chỉ nên có duy nhất một thẻ h1. -->
    <h1>ĐĂNG KÝ</h1> <!-- Tiêu đề lớn nhất của bài đăng ký -->
    
    <!-- <form>: フォーム要素(ふぉーむようそ) (Biểu mẫu)
         1. Chức năng: Tạo một khu vực chứa các trường nhập liệu tương tác.
         2. Lý do: Thu thập thông tin đăng ký (username, email, password).
         3. Lưu ý: Cần chỉ định thuộc tính action và method để gửi dữ liệu chính xác. -->
    <form action="register.php" method="post"> <!-- Form gửi dữ liệu POST đến file xử lý -->
        <label for="username">Username:</label> <!-- label gắn nhãn input cho truy cập -->
        <input type="text" id="username" name="username" required> <!-- input text bắt buộc -->
        <br> <!-- ngắt dòng trình bày -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required> <!-- input email tự validate cơ bản -->
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required> <!-- input mật khẩu ẩn -->
        <br>
        <input type="submit" value="Signup"> <!-- nút gửi form -->
    </form>
    
    <!-- <div>: コンテナ要素(こんてなようそ) (Thẻ chứa/khối)
         1. Chức năng: Tạo một vùng chứa (wrapper) để gộp nhóm nút bấm.
         2. Lý do: Giúp dễ dàng định dạng CSS cho khu vực nút back.
         3. Lưu ý: Có thể cân nhắc dùng thẻ <nav> hoặc <section> nếu phù hợp ngữ nghĩa hơn. -->
    <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <a class="back-dashboard" href="../../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
