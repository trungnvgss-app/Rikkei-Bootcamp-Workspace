<!doctype html>
<html lang="vi">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Cá Nhân</title>
  </head>
  <!-- <body>: 本文(ほんぶん) (Phần thân tài liệu)
       1. Chức năng: Chứa toàn bộ nội dung hiển thị trên trang web.
       2. Lý do: Đây là vùng không gian chính để trình duyệt render các phần tử UI.
       3. Lưu ý: Mọi phần tử nhìn thấy được đều phải nằm trong thẻ này. -->
  <body>
    <!-- <h1>: 見出し要素(みだしようそ) (Thẻ tiêu đề cấp 1)
         1. Chức năng: Hiển thị tiêu đề chính lớn nhất của trang web.
         2. Lý do: Dùng làm tên chính của bản CV.
         3. Lưu ý: Mỗi trang chỉ nên có duy nhất một thẻ h1. -->
    <h1>Nguyễn Văn A</h1>
    <p><strong>Chức danh:</strong> Sinh viên Frontend</p>
    <h2>Giới thiệu</h2>
    <p>
      Tôi là Nguyễn Văn A, hiện đang học lập trình Frontend và thực hiện bài tập
      Module 1.
    </p>
    <h2>Kỹ năng</h2>
    
    <!-- <ul>: 順不同リスト(じゅんふどうりすと) (Danh sách không thứ tự)
         1. Chức năng: Tạo danh sách các mục có dấu chấm đầu dòng.
         2. Lý do: Phù hợp để liệt kê các kỹ năng rời rạc không cần theo thứ tự.
         3. Lưu ý: Bắt buộc phải chứa các thẻ <li> bên trong. -->
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript cơ bản</li>
    </ul>
    <h2>Liên hệ</h2>
    <p>Email: nguyenvana@example.com</p>
      
    <!-- <div>: コンテナ要素(こんてなようそ) (Thẻ chứa/khối)
         1. Chức năng: Tạo một vùng chứa (wrapper) để gộp nhóm nút bấm.
         2. Lý do: Giúp dễ dàng định dạng CSS (margin, padding, border) cho khu vực nút back.
         3. Lưu ý: Có thể cân nhắc dùng thẻ <nav> hoặc <section> nếu phù hợp ngữ nghĩa hơn. -->
    <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
