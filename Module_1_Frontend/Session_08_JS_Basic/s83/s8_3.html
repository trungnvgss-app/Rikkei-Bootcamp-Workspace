<!doctype html>
<html lang="en">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="s8_3.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa nội dung Flex + Grid)
       1. Chức năng: Chứa các khối thông tin để thực hành kết hợp Flex và Grid.
       2. Lý do: Là container gốc cho bài tập layout hỗn hợp.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <div>
    <!-- <div>: コンテナ要素(こんてなようそ) (Khung chứa Grid Container)
         1. Chức năng: Thiết lập lưới 2 cột và căn giữa văn bản.
         2. Lý do: Minh họa cách sắp xếp nội dung cân đối.
         3. Lưu ý: Có class "grid-container" để định dạng trong CSS. -->
      <div class="grid-container">
        <div class="grid-item">Thông tin 1</div>
        <div class="grid-item">Thông tin 2</div>
        <div class="grid-item">Thông tin 3</div>
        <div class="grid-item">Thông tin 4</div>
      </div>
    </div>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
