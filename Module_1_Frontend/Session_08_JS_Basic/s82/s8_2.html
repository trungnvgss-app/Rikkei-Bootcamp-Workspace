<!doctype html>
<html lang="en">
<!-- <head>: ヘッダー(へっだー) (Thông tin tiêu đề và cấu hình trang) -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="s8_2.css" />
  </head>
  <!-- <body>: ボディ(ぼでぃ) (Thân trang web chứa nội dung Grid cơ bản)
       1. Chức năng: Chứa các khối để thực hành chia cột trong CSS Grid.
       2. Lý do: Là container gốc cho bài tập layout lưới.
       3. Lưu ý: Mọi thành phần hiển thị đều nằm trong thẻ này. -->
  <body>
    <!-- <div>: コンテナ要素(こんてなようそ) (Khung chứa Grid)
         1. Chức năng: Thiết lập môi trường lưới để sắp xếp các cột.
         2. Lý do: Minh họa cách sử dụng grid-template-columns.
         3. Lưu ý: Có class "grid-container" để định dạng trong CSS. -->
    <div class="grid-container">
      <div class="grid-item">Cột 1</div>
      <div class="grid-item">Cột 2</div>
      <div class="grid-item">Cột 3</div>
      <div class="grid-item">Cột 4</div>
    </div>
      <div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc;">
      <!-- <a>: アンカー(あんかー) (Nút quay lại trang Dashboard) -->
      <a class="back-dashboard" href="../../index.html" style="display:inline-block;padding:10px 16px;background:#d32f2f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">← Quay lại Dashboard</a>
    </div>
  </body>
</html>
