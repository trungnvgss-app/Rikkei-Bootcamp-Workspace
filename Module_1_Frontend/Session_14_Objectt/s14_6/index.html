<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thư Viện</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button {
            padding: 12px 20px;
            font-size: 1.1em;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            color: #343a40;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        pre {
            background-color: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1em;
            white-space: pre-wrap;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📚 Ứng Dụng Quản Lý Sách Thư Viện</h2>
        <p>Nhấn nút bên dưới để mở Menu quản lý.</p>
        
        <button onclick="quanLyThuVien()">Mở Ứng Dụng</button>

        <pre id="hienThiDanhSach">Danh sách sách sẽ hiển thị ở đây...</pre>
    </div>

    <script src="script.js"></script>

    </div>

</html>
